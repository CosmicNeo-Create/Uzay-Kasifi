<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzay Bilgi Testi | Uzay Kaşifi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<style>
*{box-sizing:border-box}
body{margin:0; width:100vw; height:100vh; overflow:hidden; background:rgba(4, 6, 18, 0.98); color:white; font-family:Arial,sans-serif; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px;}

.kapatBtn{position:absolute; right:20px; top:20px; background:#151a31; color:white; border:1px solid #454d70; border-radius:7px; padding:10px 16px; cursor:pointer; font-size:14px; font-weight:bold;}
.kapatBtn:hover{background:#29356e;}

h2{margin:0 0 15px 0; color:#ff88ff; font-size:28px; text-align:center; text-shadow:0 0 10px rgba(255,0,255,0.4);}

.zorlukSecimKapsayici{display:flex; flex-direction:column; gap:15px; max-width:480px; width:100%; align-items:center;}
.zorlukBtn{width:100%; padding:18px; font-size:18px; font-weight:bold; border-radius:12px; cursor:pointer; border:1px solid #5868c9; transition:0.2s; text-align:center;}
#kolaySecimBtn{background:#003322; color:#00ffcc; border-color:#00ffcc;}
#kolaySecimBtn:hover{background:#005533;}
#ortaSecimBtn{background:#332200; color:#ffcc00; border-color:#ffcc00;}
#ortaSecimBtn:hover{background:#553800;}
#zorSecimBtn{background:#330000; color:#ff4444; border-color:#ff4444;}
#zorSecimBtn:hover{background:#550000;}

#aktifTestBolumu{display:none; flex-direction:column; align-items:center; gap:20px; width:100%; max-width:800px;}
.testSoruMetin{font-size:18px; color:#ffffff; line-height:1.5; background:#0c1026; padding:22px; border-radius:12px; border:1px solid #333d75; text-align:center; width:100%;}
.testSeceneklerContainer{display:flex; flex-direction:column; gap:10px; width:100%;}
.testSecenekBtn{background:#18214a; border:1px solid #4452a3; border-radius:10px; padding:14px; color:white; font-size:15px; text-align:left; cursor:pointer; transition:0.2s; width:100%;}
.testSecenekBtn:hover{background:#2a3675; border-color:#ff00ff;}
</style>

<script src="KolaySorular.js"></script>
<script src="OrtaSorular.js"></script>
<script src="ZorSorular.js"></script>
</head>
<body>

<button class="kapatBtn" onclick="window.location.href='index.html'">Simülasyona Dön X</button>

<div id="zorlukSecimBolumu" class="zorlukSecimKapsayici">
    <h2>Test Zorluk Seviyesi Seçin</h2>
    <button class="zorlukBtn" id="kolaySecimBtn" onclick="zorlukSec('kolay')">🟢 Kolay Seviye Testi</button>
    <button class="zorlukBtn" id="ortaSecimBtn" onclick="zorlukSec('orta')">🟡 Orta Seviye Testi</button>
    <button class="zorlukBtn" id="zorSecimBtn" onclick="zorlukSec('zor')">🔴 Zor Seviye Testi</button>
</div>

<div id="aktifTestBolumu">
    <h2 id="testBaslikMetin">Uzay Bilgi Testi</h2>
    <div class="testSoruMetin" id="testSoruMetin">Soru yükleniyor...</div>
    <div class="testSeceneklerContainer" id="testSeceneklerContainer"></div>
    <div id="testGeriBildirim" style="font-size:16px; font-weight:bold; min-height:24px; text-align:center;"></div>
</div>

<script>
let audioCtx = null;
function efektCal(freq = 440, sure = 0.1){
    try {
        if(!audioCtx){
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + sure);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + sure);
    } catch(e){}
}

let secilenZorlukHavuzu = [];
let aktifTestSorulari = [];
let testSoruIndex = 0;
let testDogruSayisi = 0;

function zorlukSec(zorlukDerecesi){
    efektCal(850, 0.1);
    if(zorlukDerecesi === 'kolay'){
        secilenZorlukHavuzu = typeof kolaySorular !== 'undefined' ? kolaySorular : [];
        document.getElementById("testBaslikMetin").textContent = "Uzay Bilgi Testi (Kolay Seviye)";
    } else if(zorlukDerecesi === 'orta'){
        secilenZorlukHavuzu = typeof ortaSorular !== 'undefined' ? ortaSorular : [];
        document.getElementById("testBaslikMetin").textContent = "Uzay Bilgi Testi (Orta Seviye)";
    } else {
        secilenZorlukHavuzu = typeof zorSorular !== 'undefined' ? zorSorular : [];
        document.getElementById("testBaslikMetin").textContent = "Uzay Bilgi Testi (Zor Seviye)";
    }

    aktifTestSorulari = [...secilenZorlukHavuzu].sort(() => 0.5 - Math.random());
    testSoruIndex = 0;
    testDogruSayisi = 0;

    document.getElementById("zorlukSecimBolumu").style.display = "none";
    document.getElementById("aktifTestBolumu").style.display = "flex";

    testSoruyuGoster();
}

function testSoruyuGoster(){
    document.getElementById("testGeriBildirim").textContent = "";
    if(testSoruIndex >= 10 || testSoruIndex >= aktifTestSorulari.length){
        document.getElementById("testSoruMetin").innerHTML = `Tebrikler! Testi tamamladın.<br><br><b>Doğru Sayısı:</b> ${testDogruSayisi} / ${Math.min(10, aktifTestSorulari.length)}<br><b>Başarı Puanı:</b> %${Math.round((testDogruSayisi / Math.min(10, aktifTestSorulari.length)) * 100)}`;
        document.getElementById("testSeceneklerContainer").innerHTML = `<button class="testSecenekBtn" style="text-align:center; background:#394a9b;" onclick="window.location.href='index.html'">Simülasyona Geri Dön</button>`;
        return;
    }

    const soruObj = aktifTestSorulari[testSoruIndex];
    document.getElementById("testSoruMetin").textContent = soruObj.s;

    let seceneklerHavuzu = [soruObj.c, ...soruObj.yanlislar];
    seceneklerHavuzu.sort(() => 0.5 - Math.random());

    const container = document.getElementById("testSeceneklerContainer");
    container.innerHTML = "";
    seceneklerHavuzu.forEach(secenek => {
        const btn = document.createElement("button");
        btn.className = "testSecenekBtn";
        btn.textContent = secenek;
        btn.onclick = () => {
            const tumBtnlar = container.querySelectorAll("button");
            tumBtnlar.forEach(b => b.disabled = true);

            const geriBildirimEl = document.getElementById("testGeriBildirim");
            if(secenek === soruObj.c){
                efektCal(900, 0.1);
                setTimeout(()=> efektCal(1200, 0.15), 100);
                testDogruSayisi++;
                geriBildirimEl.style.color = "#00ffcc";
                geriBildirimEl.textContent = "✔ Doğru Cevap!";
            } else {
                efektCal(200, 0.2);
                geriBildirimEl.style.color = "#ff4444";
                geriBildirimEl.textContent = `✖ Yanlış Cevap! Doğrusu: "${soruObj.c}"`;
            }
            
            setTimeout(() => {
                testSoruIndex++;
                testSoruyuGoster();
            }, 1800);
        };
        container.appendChild(btn);
    });
}
</script>
</body>
</html>
