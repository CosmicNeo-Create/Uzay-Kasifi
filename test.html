let audioCtx = null;
function efektCal(freq = 440, sure = 0.1){
    try {
        if(!audioCtx){
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + sure);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + sure);
    } catch(e){}
}

    { s: "Gezegenlerin Güneş etrafındaki eliptik yörüngelerinde eşit zamanlarda eşit alanlar taradığını ifade eden yasa kimin yasasıdır?", c: "Keppler'in İkinci Yasası (Alanlar Kanunu)", yanlislar: ["Newton'un Evrensel Çekim Yasası", "Einstein'ın Alan Denklemleri", "Hubble Genişleme Yasası"] },
    { s: "Yıldız evriminde 'Triple-Alpha' (Üçlü Alfa) reaksiyonu hangi elementin sentezlenmesinden sorumludur?", c: "Helyumdan Karbon üretimi", yanlislar: ["Hidrojenden Helyum üretimi", "Demirden Nikel üretimi", "Karbondan Oksijen üretimi"] },
    { s: "Evrenin genişleme hızını tayin eden ve uzak galaksilerin uzaklaşma hızını mesafeyle ilişkilendiren parametre nedir?", c: "Hubble Sabiti", yanlislar: ["Planck Sabiti", "Stefan-Boltzmann Sabiti", "Gravitasyonel Sabit"] },
    { s: "Yıldızlararası ortamda bulunan ve optik ışığı engelleyen soğuk gaz ve toz bulutlarına ne ad verilir?", c: "Karanlık Nebulalar (Dark Nebulae)", yanlislar: ["Gezegenimsi bulutsular", "Yansıma nebulaları", "Kutupsal halkalar"] },
    { s: "Bir yıldızın kendi kütle çekimiyle çökmesini engelleyen temel basınç kuvveti ile termal basınç arasındaki denge durumuna ne denir?", c: "Hidrostatik Denge", yanlislar: ["Termodinamik Entropi Dengesi", "Manyetohidrodinamik Denge", "Kuantum Degenerasyon Dengelemesi"] },
    { s: "Genel görelilik teorisinde kütleli cisimlerin arkasındaki ışığı bükerek mercek etkisi oluşturması olayına ne denir?", c: "Kütleçekimsel Mercekleme (Gravitational Lensing)", yanlislar: ["Işık sapması aborpsiyonu", "Foton dispersiyonu", "Spektral Doppler kayması"] }
];
const zorEkListesi = [
    "Radyoaktif bozunmalar ve nötron yakalama süreçleriyle evrendeki demirden ağır elementlerin sentezlendiği olay nedir?|Nötron yıldızı çarpışmaları (Kilonova) ve Süpernovalar|Beyaz cüce patlamaları,Güneş püskürmeleri,Galaktik çarpışmalar",
    "Kuantum mekaniğinde karadeliklerin termodinamik özellikler göstererek dışarıya termal radyasyon yaymasına ne denir?|Hawking Radyasyonu|Çerenkov Işıması,Synchrotron Işıması,Bremsstrahlung Işıması",
    "Gök cisimlerinin tayf çizgilerindeki dalga boyu kaymalarını inceleyerek radyal hızlarını bulmamızı sağlayan ilke nedir?|Doppler Etkisi|Zeeman Etkisi,Fotoelektrik Etkisi,Compton Saçılması",
    "Güneş tayfındaki karanlık soğurma çizgilerine ne ad verilir?|Fraunhofer Çizgileri|Balmer Serisi,Lyman Çizgileri,Zeeman Bölünmeleri",
    "Yıldızların parlaklıklarını logaritmik olarak sınıflandıran kadir (magnitude) ölçeğinde 1 kadir fark parlaklık oranını yaklaşık kaç kat değiştirir?|2.512 kat|10 kat,100 kat,5 kat"
];
let zSayac = 1;
while(zorSorular.length < 300){
    let base = zorEkListesi[(zSayac - 1) % zorEkListesi.length].split("|");
    zorSorular.push({
        s: `[Astrofizik Seviye #${zSayac}] ` + base[0],
        c: base[1],
        yanlislar: base[2].split(",")
    });
    zSayac++;
}

/* -------------------------------------------------------------------------
   TEST AKIŞ YÖNETİMİ
   ------------------------------------------------------------------------- */
let secilenZorlukHavuzu = [];
let aktifTestSorulari = [];
let testSoruIndex = 0;
let testDogruSayisi = 0;

function zorlukSec(zorlukDerecesi){
    efektCal(850, 0.1);
    if(zorlukDerecesi === 'kolay'){
        secilenZorlukHavuzu = kolaySorular;
        document.getElementById("testBaslikMetin").textContent = "Uzay Bilgi Testi (Kolay Seviye - 500 Soru Havuzu)";
    } else if(zorlukDerecesi === 'orta'){
        secilenZorlukHavuzu = ortaSorular;
        document.getElementById("testBaslikMetin").textContent = "Uzay Bilgi Testi (Orta Seviye - 500 Soru Havuzu)";
    } else {
        secilenZorlukHavuzu = zorSorular;
        document.getElementById("testBaslikMetin").textContent = "Uzay Bilgi Testi (Zor Seviye - 300 Astrofizik Soru Havuzu)";
    }

    aktifTestSorulari = [...secilenZorlukHavuzu].sort(() => 0.5 - Math.random());
    testSoruIndex = 0;
    testDogruSayisi = 0;

    document.getElementById("zorlukSecimBolumu").style.display = "none";
    document.getElementById("aktifTestBolumu").style.display = "flex";

    testSoruyuGoster();
}

function testSoruyuGoster(){
    document.getElementById("testGeriBildirim").textContent = "";
    if(testSoruIndex >= 10){
        document.getElementById("testSoruMetin").innerHTML = `Tebrikler! Testi tamamladın.<br><br><b>Doğru Sayısı:</b> ${testDogruSayisi} / 10<br><b>Başarı Puanı:</b> %${testDogruSayisi * 10}`;
        document.getElementById("testSeceneklerContainer").innerHTML = `<button class="testSecenekBtn" style="text-align:center; background:#394a9b;" onclick="window.location.href='index.html'">Simülasyona Geri Dön</button>`;
        return;
    }

    const soruObj = aktifTestSorulari[testSoruIndex];
    document.getElementById("testSoruMetin").textContent = soruObj.s;

    let seceneklerHavuzu = [soruObj.c, ...soruObj.yanlislar];
    seceneklerHavuzu.sort(() => 0.5 - Math.random());

    const container = document.getElementById("testSeceneklerContainer");
    container.innerHTML = "";
    seceneklerHavuzu.forEach(secenek => {
        const btn = document.createElement("button");
        btn.className = "testSecenekBtn";
        btn.textContent = secenek;
        btn.onclick = () => {
            const tumBtnlar = container.querySelectorAll("button");
            tumBtnlar.forEach(b => b.disabled = true);

            const geriBildirimEl = document.getElementById("testGeriBildirim");
            if(secenek === soruObj.c){
                efektCal(900, 0.1);
                setTimeout(()=> efektCal(1200, 0.15), 100);
                testDogruSayisi++;
                geriBildirimEl.style.color = "#00ffcc";
                geriBildirimEl.textContent = "✔ Doğru Cevap!";
            } else {
                efektCal(200, 0.2);
                geriBildirimEl.style.color = "#ff4444";
                geriBildirimEl.textContent = `✖ Yanlış Cevap! Doğrusu: "${soruObj.c}"`;
            }
            
            setTimeout(() => {
                testSoruIndex++;
                testSoruyuGoster();
            }, 1800);
        };
        container.appendChild(btn);
    });
}
</script>
